params:
  - id: api_key_pepper
    type: secret
    name: API key pepper
    description: "Server-side secret used to HMAC stored API key hashes, at least 32 characters. Changing it invalidates all issued API keys."
    default_value: "$random(len=48)"
    optional: false
locales:
  zh:
    api_key_pepper:
      name: API key 加密盐
      description: 用于对 API key 哈希做 HMAC 的服务端密钥，至少 32 位。修改后已签发的 API key 全部失效。
