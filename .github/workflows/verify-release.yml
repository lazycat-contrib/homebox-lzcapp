name: Verify Homebox Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact LPK release tag
        required: true
        default: v0.27.1
        type: string
permissions:
  contents: read
concurrency:
  group: homebox-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download exact Release asset on runner
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="community.lazycat.app.homebox-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg
      - name: Verify artifact, sqlite single container and documented env names
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys, tarfile
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', 'PyYAML==6.0.3'])
              import yaml

          name = os.environ['ASSET_NAME']
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')

          meta = json.loads(Path('release-metadata.json').read_text())
          assets = [a for a in meta['assets'] if a['name'] == name]
          assert len(assets) == 1, assets
          pkg = Path('verify-pkg') / name

          h = hashlib.sha256()
          with pkg.open('rb') as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b''):
                  h.update(chunk)
          assert 'sha256:' + h.hexdigest() == assets[0]['digest'], 'Release digest mismatch'

          with tarfile.open(pkg) as package:
              names = set(package.getnames())
              assert {'package.yml', 'manifest.yml', 'content.tar', 'icon.png'} <= names, names

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.homebox'
              assert str(info['version']) == version
              assert info['name'] == 'Homebox'
              assert info['license'] == 'AGPL-3.0'
              assert str(info['min_os_version']) == '1.5.0'

              text = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(text)
              app = m['application']
              assert app['subdomain'] == 'homebox'
              upstreams = app['upstreams']
              assert any(u['location'] == '/package-licenses/' and u['backend'].startswith('file://') for u in upstreams)
              assert any(u['location'] == '/' and u['backend'] == 'http://homebox:7745/' for u in upstreams)
              assert 'public_path' not in app

              svc = m['services']['homebox']
              # Mirror host is resolved at build time; assert on the repository part.
              assert 'sysadminsmedia/homebox' in svc['image'], svc['image']
              assert svc['binds'] == ['/lzcapp/var/data:/data']
              env = '\n'.join(svc['environment'])
              # Env names must match upstream's documented table, not guessed ones.
              assert 'HBOX_STORAGE_PREFIX_PATH=/data/' in env
              assert 'HBOX_STORAGE_CONN_STRING=' in env and 'homebox.db' in env
              assert 'HBOX_STORAGE_DATA' not in env
              assert 'HBOX_STORAGE_SQLITE_URL' not in env
              # No built-in credential: the first account is self-registered.
              assert 'HBOX_OPTIONS_ALLOW_REGISTRATION=true' in env
              assert 'HBOX_OPTIONS_ALLOW_LOCAL_LOGIN=true' in env
              # No outbound chatter.
              assert 'HBOX_OPTIONS_GITHUB_RELEASE_CHECK=false' in env
              assert 'HBOX_OPTIONS_ALLOW_ANALYTICS=false' in env
              # 0.27.x refuses to boot without an API key pepper of >=32 bytes.
              assert 'HBOX_AUTH_API_KEY_PEPPER=' in env
              assert '.U.api_key_pepper' in env
              params = yaml.safe_load(package.extractfile('deploy_params.yml').read())
              by_id = {q['id']: q for q in params['params']}
              assert 'api_key_pepper' in by_id, by_id.keys()
              assert by_id['api_key_pepper']['type'] == 'secret'
              assert by_id['api_key_pepper']['optional'] is False
              assert 'random' in str(by_id['api_key_pepper'].get('default_value', ''))
              assert 'healthcheck' not in text
              assert 'lzc-file-chooser' not in text

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  members = content.getnames()
                  lic = [n for n in members if 'licenses/' in n]
                  assert lic, members
                  license_text = content.extractfile(lic[0]).read().decode()
              assert 'GNU AFFERO GENERAL PUBLIC LICENSE' in license_text

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Independent cloud artifact verification\n\n' + json.dumps(result, indent=2) + '\n')
